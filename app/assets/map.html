<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body,#map{height:100%;margin:0;background:#0b0c0e}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
  .sheet{position:fixed;left:14px;right:14px;bottom:16px;background:rgba(16,17,20,.94);
    border:1px solid #262a31;border-radius:22px;padding:16px 18px;color:#ecedef;
    box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:1000}
  .hint{font-size:10px;letter-spacing:.24em;color:#8a8f98;font-weight:700}
  .coord{font-size:15px;margin:8px 0 12px;color:#ecedef;letter-spacing:.04em}
  #ok{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;letter-spacing:.22em;
    font-size:11px;color:#14151a;background:linear-gradient(90deg,#ffd66b,#ff8a5c)}
  .modes{display:flex;gap:8px;margin:0 0 12px}
  .modes button{flex:1;border:0;border-radius:10px;padding:9px 0;font-size:9px;font-weight:700;
    letter-spacing:.18em;background:#1d2026;color:#8a8f98}
  .modes button.on{background:#ff6a3d;color:#14151a}
  .leaflet-container{font-family:inherit;background:#0b0c0e}
  .leaflet-control-attribution{background:rgba(255,255,255,.8)!important;font-size:9px!important}
</style>
</head>
<body>
<div id="map"></div>
<div class="sheet">
  <div class="hint">TAP MAP TO DROP PIN</div>
  <div class="modes">
    <button id="mMap" class="on">MAP</button>
    <button id="mSat">SATELLITE</button>
    <button id="mHyb">HYBRID</button>
  </div>
  <div class="coord" id="coord">—</div>
  <button id="ok">CONFIRM LOCATION</button>
</div>
<script>
var init = {lat:26.1445, lng:91.7362, zoom:15};
try { init = JSON.parse(AndroidBridge.getInitial()); } catch(e) {}
var map = L.map('map', {zoomControl:false}).setView([init.lat, init.lng], init.zoom || 15);
L.control.zoom({position:'topright'}).addTo(map);

// Live Google Maps raster tiles (same rendering as the Google Maps app), keyless.
var MODES = {
  mMap: 'm',   // Google road map
  mSat: 's',   // Google satellite
  mHyb: 'y'    // Google hybrid (satellite + labels)
};
var current = null, currentMode = 'mMap', usingGoogle = true;

function googleLayer(lyrs) {
  return L.tileLayer('https://mt{s}.google.com/vt/lyrs=' + lyrs + '&x={x}&y={y}&z={z}', {
    subdomains: ['0','1','2','3'],
    attribution: 'Map data &copy; Google',
    maxZoom: 20
  });
}
var osm = null;
function fallbackLayer() {
  if (!osm) osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  });
  return osm;
}

var errs = 0, switched = false;
function setMode(id) {
  currentMode = id;
  if (current) map.removeLayer(current);
  current = usingGoogle ? googleLayer(MODES[id]) : fallbackLayer();
  current.on('tileerror', function(){
    errs++;
    if (usingGoogle && !switched && errs > 4) {
      switched = true; usingGoogle = false;
      map.removeLayer(current);
      current = fallbackLayer().addTo(map);
      try { AndroidBridge.toast('Google tiles unreachable - switched to OpenStreetMap'); } catch(e) {}
    }
  });
  current.addTo(map);
  for (var k in MODES) document.getElementById(k).className = (k === id) ? 'on' : '';
}
setMode('mMap');
document.getElementById('mMap').onclick = function(){ setMode('mMap'); };
document.getElementById('mSat').onclick = function(){ setMode('mSat'); };
document.getElementById('mHyb').onclick = function(){ setMode('mHyb'); };

var marker = null, circle = null, lat = null, lng = null;
map.on('click', function(e){
  lat = e.latlng.lat; lng = e.latlng.lng;
  if (marker) { marker.setLatLng(e.latlng); circle.setLatLng(e.latlng); }
  else {
    marker = L.marker(e.latlng).addTo(map);
    circle = L.circle(e.latlng, {radius:150, color:'#FF6A3D', weight:2, fillOpacity:0.12}).addTo(map);
  }
  document.getElementById('coord').textContent = lat.toFixed(5) + ", " + lng.toFixed(5);
});
document.getElementById('ok').onclick = function(){
  if (lat == null) { AndroidBridge.toast('Tap the map first'); return; }
  AndroidBridge.confirm(lat, lng);
};
</script>
</body>
</html>
